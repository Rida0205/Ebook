<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة كتاب القدر | HIRAE Ebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: #f0ebe2;
            direction: rtl;
        }
        .navbar {
            background: #1f2a1b;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .navbar a {
            color: #d4a762;
            text-decoration: none;
            font-weight: 600;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls button {
            background: #3a2e22;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: 0.2s;
        }
        .controls button:hover {
            background: #d4a762;
            color: #1f2a1b;
        }
        .pdf-container {
            display: flex;
            justify-content: center;
            padding: 30px;
            background: #e3d9cc;
            min-height: calc(100vh - 80px);
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 8px;
            max-width: 100%;
            height: auto;
            background: white;
        }
        .page-info {
            text-align: center;
            margin: 20px;
            font-weight: 600;
        }
        @media (max-width: 700px) {
            .navbar { flex-direction: column; gap: 10px; text-align: center; }
            .pdf-container { padding: 15px; }
        }
    </style>
</head>
<body>
<div class="navbar">
    <div><i class="fas fa-book-open"></i> HIRAE Ebook | <a href="index.html">الرجوع إلى المكتبة</a></div>
    <div class="controls">
        <button id="prevBtn"><i class="fas fa-chevron-right"></i> السابق</button>
        <span id="pageInfo">صفحة 0 / 0</span>
        <button id="nextBtn">التالي <i class="fas fa-chevron-left"></i></button>
        <a href="qadar.pdf" download style="background:#d4a762; padding:6px 18px; border-radius:40px; color:#1f2a1b; text-decoration:none;"><i class="fas fa-download"></i> تحميل PDF</a>
    </div>
</div>
<div class="pdf-container">
    <div>
        <canvas id="pdfCanvas"></canvas>
        <div id="loadingMsg" style="text-align:center; padding:50px;">جاري تحميل الكتاب... <i class="fas fa-spinner fa-pulse"></i></div>
    </div>
</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    const url = "qadar.pdf";
    let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null;
    const canvas = document.getElementById("pdfCanvas");
    const ctx = canvas.getContext("2d");
    const loadingMsg = document.getElementById("loadingMsg");

    function renderPage(num) {
        if (pageRendering) { pageNumPending = num; return; }
        pageRendering = true;
        pdfDoc.getPage(num).then(page => {
            const viewport = page.getViewport({ scale: 1.3 });
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            const renderCtx = { canvasContext: ctx, viewport: viewport };
            page.render(renderCtx).promise.then(() => {
                pageRendering = false;
                if (pageNumPending !== null) { renderPage(pageNumPending); pageNumPending = null; }
            });
            document.getElementById("pageInfo").innerText = `صفحة ${num} / ${pdfDoc.numPages}`;
            loadingMsg.style.display = "none";
        });
    }

    function queueRender(num) {
        if (pageRendering) pageNumPending = num;
        else renderPage(num);
    }

    function onPrevPage() { if (pageNum <= 1) return; pageNum--; queueRender(pageNum); }
    function onNextPage() { if (pageNum >= pdfDoc.numPages) return; pageNum++; queueRender(pageNum); }

    pdfjsLib.getDocument(url).promise.then(doc => {
        pdfDoc = doc;
        document.getElementById("pageInfo").innerText = `صفحة 1 / ${doc.numPages}`;
        renderPage(pageNum);
    }).catch(err => {
        loadingMsg.innerHTML = `<i class="fas fa-exclamation-triangle"></i> تعذر تحميل الكتاب. تأكد من وجود ملف qadar.pdf في نفس المجلد.<br>${err.message}`;
    });

    document.getElementById("prevBtn").addEventListener("click", onPrevPage);
    document.getElementById("nextBtn").addEventListener("click", onNextPage);
</script>
</body>
</html>
